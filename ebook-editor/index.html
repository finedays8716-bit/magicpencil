<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬마곰의 마술연필 이야기책</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#fff8e9;color:#3b3025;font-family:system-ui,"Noto Sans KR",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}.head{text-align:center}.head h1{margin:5px;font-size:clamp(25px,3vw,40px)}
.head p{margin:7px 0 16px}.toolbar,.pagebar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}
button,.filebtn{border:0;background:#fff;padding:11px 16px;border-radius:15px;box-shadow:0 2px 9px #0002;font-weight:750;font-size:16px;cursor:pointer}
.primary{background:#ffe36e}.danger{color:#a00}.editor{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}
.canvasWrap{background:#fff;border-radius:20px;box-shadow:0 5px 20px #0002;padding:10px}
.page{position:relative;aspect-ratio:16/9;overflow:hidden;background:white;border-radius:13px}
.page .photo{width:100%;height:100%;object-fit:contain;display:block}
.overlay{position:absolute;left:12%;top:12%;min-width:90px;max-width:55%;padding:9px 13px;cursor:move;user-select:none;white-space:pre-wrap}
.overlay.text{font-size:28px;font-weight:750;text-shadow:0 1px 2px white}
.overlay.bubble{background:white;border:3px solid #42382e;border-radius:26px;font-size:24px;font-weight:700;padding:14px 18px}
.overlay.selected{outline:3px dashed #f2b600}.side{background:#fff;border-radius:18px;padding:15px;box-shadow:0 5px 20px #0001}
.side label{display:block;font-weight:800;margin:9px 0 5px}.side input,.side textarea{width:100%;padding:10px;border:2px solid #ddd0a4;border-radius:11px;font-size:16px}
.side input[type=range]{padding:0}.thumbs{display:flex;gap:8px;overflow:auto;padding:8px 2px}.thumb{flex:0 0 112px;background:#fff;border:3px solid transparent;border-radius:12px;padding:5px;cursor:pointer;text-align:center}
.thumb.active{border-color:#f1c83d}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#eee}.thumb small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer{display:none}.book{max-width:1100px;margin:auto;background:white;border-radius:22px;box-shadow:0 8px 30px #0002;overflow:hidden}
.bookPage{position:relative;aspect-ratio:16/9;background:white}.bookPage img{width:100%;height:100%;object-fit:contain}
.endText{position:absolute;left:8%;right:8%;bottom:5%;background:#fffffff0;border-radius:18px;padding:14px;text-align:center;font-size:clamp(19px,2.3vw,32px);font-weight:900}
.nav{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px}.counter{font-weight:800}
@media(max-width:800px){.editor{grid-template-columns:1fr}.side{order:-1}.overlay.text{font-size:20px}.overlay.bubble{font-size:18px}}
</style>
</head>
<body>
<div class="wrap" id="editMode">
  <div class="head"><h1>📖 우리들의 마술연필 이야기책</h1><p>아이들의 완성 그림을 올리고, 말풍선과 글자를 넣어 E북을 만들어 보세요.</p></div>
  <div class="toolbar">
    <label class="filebtn">🖼️ 그림 추가<input id="files" type="file" accept="image/*" multiple hidden></label>
    <button id="addText">✏️ 글자 넣기</button><button id="addBubble">💬 말풍선 넣기</button>
    <button id="deleteObj" class="danger">선택 요소 삭제</button><button id="deletePage" class="danger">현재 페이지 삭제</button>
    <button id="preview" class="primary">📖 완성된 E북 보기</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="editor">
    <div class="canvasWrap"><div class="page" id="page"><img class="photo" id="photo"></div></div>
    <aside class="side">
      <label>이름 / 페이지 제목</label><input id="caption" placeholder="예: 민지의 노루 숲">
      <label>선택한 글 내용</label><textarea id="content" rows="4" placeholder="글자나 말풍선을 선택해 수정하세요."></textarea>
      <label>글자 크기</label><input id="fontSize" type="range" min="16" max="52" value="28">
      <p style="font-size:13px;line-height:1.55">말풍선과 글자는 마우스나 손가락으로 끌어서 위치를 옮길 수 있습니다. 작업 내용은 이 브라우저에 자동 저장됩니다.</p>
    </aside>
  </div>
</div>

<div class="wrap viewer" id="viewMode">
 <div class="book"><div class="bookPage" id="bookPage"></div>
 <div class="nav"><button id="prev">〈 이전</button><span class="counter" id="counter"></span><button id="next">다음 〉</button></div></div>
 <div class="toolbar"><button id="backEdit">✏️ 편집으로 돌아가기</button></div>
</div>

<script>
let pages=JSON.parse(localStorage.getItem('magicEbookPages')||'[]'), current=0, selected=null, viewIndex=0;
const pageEl=document.querySelector('#page'), photo=document.querySelector('#photo'), thumbs=document.querySelector('#thumbs');
const save=()=>localStorage.setItem('magicEbookPages',JSON.stringify(pages));
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ensure(){if(!pages.length) pages.push({img:'',caption:'',items:[]})}
function render(){
 ensure(); let p=pages[current]; photo.src=p.img||''; document.querySelector('#caption').value=p.caption||''; selected=null;
 pageEl.querySelectorAll('.overlay').forEach(x=>x.remove());
 p.items.forEach((it,i)=>{let d=document.createElement('div');d.className='overlay '+it.type;d.textContent=it.text;d.style.left=it.x+'%';d.style.top=it.y+'%';d.style.fontSize=it.size+'px';d.dataset.i=i;drag(d);d.onclick=e=>{e.stopPropagation();select(d)};pageEl.appendChild(d)});
 renderThumbs(); save();
}
function renderThumbs(){thumbs.innerHTML='';pages.forEach((p,i)=>{let d=document.createElement('div');d.className='thumb '+(i===current?'active':'');d.innerHTML=`<img src="${p.img||''}"><small>${esc(p.caption||('페이지 '+(i+1)))}</small>`;d.onclick=()=>{current=i;render()};thumbs.appendChild(d)})}
function select(d){pageEl.querySelectorAll('.overlay').forEach(x=>x.classList.remove('selected'));selected=d;d.classList.add('selected');let it=pages[current].items[+d.dataset.i];document.querySelector('#content').value=it.text;document.querySelector('#fontSize').value=it.size}
function add(type){let text=type==='bubble'?'고마워!':'이야기를 써 주세요.';pages[current].items.push({type,text,x:15,y:15,size:type==='bubble'?24:28});render();select(pageEl.querySelectorAll('.overlay')[pages[current].items.length-1])}
function drag(el){let sx,sy,ox,oy,go=false;el.onpointerdown=e=>{go=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);select(el)};el.onpointermove=e=>{if(!go)return;let r=pageEl.getBoundingClientRect();let x=Math.max(0,Math.min(88,ox+(e.clientX-sx)/r.width*100)),y=Math.max(0,Math.min(88,oy+(e.clientY-sy)/r.height*100));el.style.left=x+'%';el.style.top=y+'%'};el.onpointerup=()=>{if(!go)return;go=false;let it=pages[current].items[+el.dataset.i];it.x=parseFloat(el.style.left);it.y=parseFloat(el.style.top);save()}}
document.querySelector('#files').onchange=e=>{[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{if(pages.length===1&&!pages[0].img&&!pages[0].items.length)pages=[];pages.push({img:r.result,caption:'',items:[]});current=pages.length-1;render()};r.readAsDataURL(f)})};
document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#addBubble').onclick=()=>add('bubble');
document.querySelector('#caption').oninput=e=>{pages[current].caption=e.target.value;renderThumbs();save()};
document.querySelector('#content').oninput=e=>{if(!selected)return;let it=pages[current].items[+selected.dataset.i];it.text=e.target.value;selected.textContent=it.text;save()};
document.querySelector('#fontSize').oninput=e=>{if(!selected)return;let it=pages[current].items[+selected.dataset.i];it.size=+e.target.value;selected.style.fontSize=it.size+'px';save()};
document.querySelector('#deleteObj').onclick=()=>{if(!selected)return;pages[current].items.splice(+selected.dataset.i,1);render()};
document.querySelector('#deletePage').onclick=()=>{if(!pages.length)return;if(confirm('현재 페이지를 삭제할까요?')){pages.splice(current,1);current=Math.max(0,Math.min(current,pages.length-1));render()}};
pageEl.onclick=()=>{selected=null;pageEl.querySelectorAll('.overlay').forEach(x=>x.classList.remove('selected'))};
function viewerPages(){return pages.filter(p=>p.img).concat([{ending:true,img:'ending.png',caption:'꼬마곰 덕분에 동물 친구들은 행복하게 살게 되었답니다!',items:[]}])}
function showBook(){let a=viewerPages(),p=a[viewIndex],b=document.querySelector('#bookPage');b.innerHTML=`<img src="${p.img}">`;(p.items||[]).forEach(it=>{let d=document.createElement('div');d.className='overlay '+it.type;d.textContent=it.text;d.style.left=it.x+'%';d.style.top=it.y+'%';d.style.fontSize=it.size+'px';b.appendChild(d)});if(p.caption){let d=document.createElement('div');d.className=p.ending?'endText':'endText';d.textContent=p.caption;b.appendChild(d)}document.querySelector('#counter').textContent=`${viewIndex+1} / ${a.length}`;document.querySelector('#prev').disabled=viewIndex===0;document.querySelector('#next').disabled=viewIndex===a.length-1}
document.querySelector('#preview').onclick=()=>{viewIndex=0;document.querySelector('#editMode').style.display='none';document.querySelector('#viewMode').style.display='block';showBook()};
document.querySelector('#backEdit').onclick=()=>{document.querySelector('#viewMode').style.display='none';document.querySelector('#editMode').style.display='block'};
document.querySelector('#prev').onclick=()=>{if(viewIndex>0){viewIndex--;showBook()}};document.querySelector('#next').onclick=()=>{if(viewIndex<viewerPages().length-1){viewIndex++;showBook()}};
render();
</script>
</body></html>
