<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>꼬마곰의 마술연필</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#fff8e8;color:#3b3328}
.app{max-width:1280px;margin:auto;padding:14px}.top{text-align:center}.top h1{margin:4px;font-size:clamp(24px,3vw,42px)}
.top p{margin:5px 0 12px;font-size:clamp(16px,1.8vw,24px)}
.namebox{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px auto 14px;font-size:20px;font-weight:800}
.namebox input{font-size:20px;padding:10px 14px;border:2px solid #d9c889;border-radius:14px;width:min(320px,60vw);background:white}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:5px solid #fff;border-radius:22px;box-shadow:0 8px 28px #0002;overflow:hidden}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage canvas{touch-action:none;cursor:url('magic-pencil-cursor.png') 12 10, crosshair}
.tools,.nav{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px}
.tools button,.magic,.nav button{font-size:20px;padding:12px 18px;border:0;border-radius:18px;background:white;box-shadow:0 3px 10px #0002;cursor:pointer}
.swatch{width:42px;height:42px;border-radius:50%;border:4px solid white;box-shadow:0 0 0 2px #777;cursor:pointer}
.magic{background:#ffe36e!important;font-weight:800}.result{display:none;text-align:center}.result img{width:100%;border-radius:22px}
.loading{display:none;position:absolute;inset:0;background:#fff9;z-index:4;place-items:center;font-size:30px;font-weight:800}
.spark{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.nav button.active{background:#ffe36e;font-weight:800}
</style></head>
<body><main class="app">
<div class="nav"><button id="deerTab" class="active">🦌 노루</button><button id="bearTab">🐻 반달가슴곰</button></div>
<section class="top"><h1 id="title"></h1><p id="guide"></p></section>
<div class="namebox">✏️ 그린 사람 <input id="artist" placeholder="이름을 써 주세요" maxlength="20"></div>
<section id="draw"><div class="stage"><img id="bg"><canvas id="c"></canvas>
<div class="loading" id="loading"><div class="spark" id="loadingText"></div></div></div>
<div class="tools">
<span class="swatch" data-c="#2e7d32" style="background:#2e7d32"></span><span class="swatch" data-c="#66bb6a" style="background:#66bb6a"></span>
<span class="swatch" data-c="#8d6e63" style="background:#8d6e63"></span><span class="swatch" data-c="#f06292" style="background:#f06292"></span>
<span class="swatch" data-c="#42a5f5" style="background:#42a5f5"></span>
<button id="undo">↩ 되돌리기</button><button id="clear">🧽 다시 그리기</button><button id="downChild">⬇ 내 그림 받기</button>
<button class="magic" id="magic"></button></div></section>
<section class="result" id="result"><h1 id="resultTitle"></h1><img id="out">
<div class="tools"><button id="downAI">⬇ AI 그림 받기</button><button id="again">다시 해보기</button></div></section>
</main>
<script>
const missions={
 deer:{label:'노루',title:'🌳 마술연필로 노루의 숲을 살려주세요!',guide:'나무와 풀, 꽃을 마음껏 그려 주세요.',bg:'forest-base.png',magic:'✨ 숲을 살려주세요!',loading:'✨ 마술연필이 숲을 살리고 있어요…',result:'🦌 노루가 활짝 웃어요!'},
 bear:{label:'반달가슴곰',title:'🐻 마술연필로 반달가슴곰을 지켜주세요!',guide:'반달가슴곰이 안전할 수 있도록 마음껏 그려 주세요.',bg:'bear-base.png',magic:'✨ 반달가슴곰을 지켜주세요!',loading:'✨ 마술연필이 곰을 지켜주고 있어요…',result:'🐻 반달가슴곰이 이제 안전해요!'}
};
let mission='deer',color='#2e7d32',drawing=false,history=[];
const c=document.querySelector('#c'),ctx=c.getContext('2d'),bg=document.querySelector('#bg');
function safeName(){return (document.querySelector('#artist').value.trim()||'이름없음').replace(/[\\/:*?"<>|]/g,'_')}
function applyMission(m){mission=m;let x=missions[m];document.querySelector('#title').textContent=x.title;document.querySelector('#guide').textContent=x.guide;bg.src=x.bg;document.querySelector('#magic').textContent=x.magic;document.querySelector('#loadingText').textContent=x.loading;document.querySelector('#resultTitle').textContent=x.result;document.querySelector('#deerTab').classList.toggle('active',m==='deer');document.querySelector('#bearTab').classList.toggle('active',m==='bear');resetDrawing();document.querySelector('#draw').style.display='block';document.querySelector('#result').style.display='none'}
function resize(){const r=c.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function pos(e){const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function start(e){drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault()}
function move(e){if(!drawing)return;ctx.strokeStyle=color;ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...pos(e));ctx.stroke();e.preventDefault()}
function end(){if(drawing){drawing=false;history.push(c.toDataURL())}}
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>color=s.dataset.c);
function resetDrawing(){ctx.clearRect(0,0,c.width,c.height);history=[]}
document.querySelector('#clear').onclick=resetDrawing;
document.querySelector('#undo').onclick=()=>{history.pop();ctx.clearRect(0,0,c.width,c.height);if(history.length){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=history.at(-1)}};
async function compositeBlob(){let x=document.createElement('canvas');x.width=1536;x.height=1024;let q=x.getContext('2d');q.drawImage(bg,0,0,x.width,x.height);q.drawImage(c,0,0,x.width,x.height);return new Promise(r=>x.toBlob(r,'image/png'))}
async function compositeDataUrl(){let b=await compositeBlob();return new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(b)})}
async function aiTransportDataUrl(){
  let x=document.createElement('canvas');
  x.width=1152;x.height=768;
  let q=x.getContext('2d');
  q.fillStyle='#fff';q.fillRect(0,0,x.width,x.height);
  q.drawImage(bg,0,0,x.width,x.height);
  q.drawImage(c,0,0,x.width,x.height);
  return x.toDataURL('image/jpeg',0.82);
}
function downloadData(data,name){let a=document.createElement('a');a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.querySelector('#downChild').onclick=async()=>downloadData(await compositeDataUrl(),`${safeName()}_${missions[mission].label}_내그림.png`);
document.querySelector('#downAI').onclick=()=>{let d=document.querySelector('#out').src;if(d)downloadData(d,`${safeName()}_${missions[mission].label}_AI완성.png`)};
document.querySelector('#magic').onclick=async()=>{let loading=document.querySelector('#loading');loading.style.display='grid';try{let dataUrl=await aiTransportDataUrl();let rr=await fetch('/api/magic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl,mission})});let j=await rr.json();if(!rr.ok)throw Error(j.error||'실패');document.querySelector('#out').src=j.image;document.querySelector('#draw').style.display='none';document.querySelector('#result').style.display='block'}catch(e){alert('AI 변환에 실패했어요.\\n'+e.message)}finally{loading.style.display='none'}};
document.querySelector('#again').onclick=()=>applyMission(mission);document.querySelector('#deerTab').onclick=()=>applyMission('deer');document.querySelector('#bearTab').onclick=()=>applyMission('bear');applyMission('deer');
</script></body></html>
