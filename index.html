<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마술연필로 노루의 숲을 살려주세요!</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#fff8e8;color:#3b3328}.app{max-width:1280px;margin:auto;padding:14px}.top{text-align:center}.top h1{margin:4px;font-size:clamp(24px,3vw,42px)}.top p{margin:5px 0 12px;font-size:clamp(16px,1.8vw,24px)}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:5px solid #fff;border-radius:22px;box-shadow:0 8px 28px #0002;overflow:hidden}.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage canvas{touch-action:none}.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px}.tools button,.magic{font-size:20px;padding:12px 18px;border:0;border-radius:18px;background:white;box-shadow:0 3px 10px #0002;cursor:pointer}.swatch{width:42px;height:42px;border-radius:50%;border:4px solid white;box-shadow:0 0 0 2px #777;cursor:pointer}.magic{background:#ffe36e;font-weight:800}.result{display:none;text-align:center}.result img{width:100%;border-radius:22px}.loading{display:none;position:absolute;inset:0;background:#fff9;z-index:4;place-items:center;font-size:30px;font-weight:800}.spark{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
</style></head><body><main class="app"><section class="top"><h1>🌳 마술연필로 노루의 숲을 살려주세요!</h1><p>나무와 풀, 꽃을 마음껏 그려 주세요.</p></section><section id="draw"><div class="stage"><img id="bg" src="forest-base.png"><canvas id="c"></canvas><div class="loading" id="loading"><div class="spark">✨ 마술연필이 숲을 살리고 있어요…</div></div></div><div class="tools"><span class="swatch" data-c="#2e7d32" style="background:#2e7d32"></span><span class="swatch" data-c="#66bb6a" style="background:#66bb6a"></span><span class="swatch" data-c="#8d6e63" style="background:#8d6e63"></span><span class="swatch" data-c="#f06292" style="background:#f06292"></span><span class="swatch" data-c="#42a5f5" style="background:#42a5f5"></span><button id="undo">↩ 되돌리기</button><button id="clear">🧽 다시 그리기</button><button id="downChild">⬇ 내 그림 받기</button><button class="magic" id="magic">✨ 숲을 살려주세요!</button></div></section><section class="result" id="result"><h1>🦌 노루가 활짝 웃어요!</h1><img id="out"><div class="tools"><button id="downAI">⬇ AI 그림 받기</button><button onclick="location.reload()">다시 해보기</button></div></section></main><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),bg=document.querySelector('#bg');let color='#2e7d32',drawing=false,last=null,history=[];
function resize(){const r=c.getBoundingClientRect();const old=c.toDataURL();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);if(history.length){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=history.at(-1)}}addEventListener('resize',resize);resize();
function pos(e){const r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return [p.clientX-r.left,p.clientY-r.top]}
function start(e){drawing=true;last=pos(e);ctx.beginPath();ctx.moveTo(...last);e.preventDefault()}function move(e){if(!drawing)return;let p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...p);ctx.stroke();last=p;e.preventDefault()}function end(){if(drawing){drawing=false;history.push(c.toDataURL())}}
c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>color=s.dataset.c);document.querySelector('#clear').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);history=[]};document.querySelector('#undo').onclick=()=>{history.pop();ctx.clearRect(0,0,c.width,c.height);if(history.length){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=history.at(-1)}};
async function compositeBlob(){let x=document.createElement('canvas');x.width=1536;x.height=1024;let q=x.getContext('2d');q.drawImage(bg,0,0,x.width,x.height);q.drawImage(c,0,0,x.width,x.height);return new Promise(r=>x.toBlob(r,'image/png'))}

function compositeDataUrl(){return new Promise(async resolve=>{let b=await compositeBlob(),r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(b)})}
function downloadData(data,name){let a=document.createElement('a');a.href=data;a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.querySelector('#downChild').onclick=async()=>downloadData(await compositeDataUrl(),`노루-아이그림-${Date.now()}.png`);
document.querySelector('#downAI').onclick=()=>{let d=document.querySelector('#out').src;if(d)downloadData(d,`노루-AI완성-${Date.now()}.png`)};

document.querySelector('#magic').onclick=async()=>{let loading=document.querySelector('#loading');loading.style.display='grid';try{let blob=await compositeBlob(),dataUrl=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});let rr=await fetch('/api/magic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})}),j=await rr.json();if(!rr.ok)throw Error(j.error||'실패');document.querySelector('#out').src=j.image;document.querySelector('#draw').style.display='none';document.querySelector('#result').style.display='block'}catch(e){alert('AI 변환에 실패했어요. API 키와 서버 설정을 확인해 주세요.\n'+e.message)}finally{loading.style.display='none'}};
</script></body></html>
