<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마술연필 E북 만들기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f0df;color:#342d25;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}
h1{text-align:center}.hint{text-align:center}.card{background:#fff;border-radius:18px;padding:15px;margin:13px 0;box-shadow:0 4px 18px #0001}
.row,.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,.file{border:0;background:#fff;border-radius:13px;padding:10px 14px;box-shadow:0 2px 8px #0002;font-weight:800;cursor:pointer}.primary{background:#ffe169}.danger{color:#a00}
input[type=text],textarea{padding:10px;border:2px solid #ded1ad;border-radius:10px;font-size:16px}.pages{display:grid;gap:10px;margin-top:10px}.item{display:grid;grid-template-columns:50px 110px 110px 1fr auto;gap:10px;align-items:center;padding:9px;border:2px solid #eee1c3;border-radius:14px}.item.sel{border-color:#e8b900;background:#fffbea}.thumb{width:110px;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:#eee}.small{font-size:12px;text-align:center}.empty{padding:25px;text-align:center;color:#877b6a;background:#faf7ef;border-radius:12px}
.book,.decor{display:none}.shell{max-width:1150px;margin:20px auto}.spread{position:relative;aspect-ratio:3/2;background:#fff;overflow:hidden;border-radius:10px;box-shadow:0 18px 42px #0003}.spread:not(.cover):after{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#0002 45%,#fff8 50%,#0002 55%,transparent);pointer-events:none}.spread img{width:100%;height:100%;object-fit:contain}.spread.cover{background:transparent;box-shadow:none;display:flex;justify-content:center;overflow:visible}.spread.cover img{width:auto;height:100%;max-width:50%;box-shadow:0 14px 34px #0003;border-radius:5px 14px 14px 5px}
.overlay{position:absolute;z-index:3;left:15%;top:15%;max-width:55%;padding:10px 14px;white-space:pre-wrap;cursor:move}.overlay.text{font-size:28px;font-weight:800;text-shadow:0 1px 2px #fff}.overlay.bubble{font-size:24px;font-weight:750;background:#fff;border:3px solid #383129;border-radius:26px}.overlay.selected{outline:3px dashed #e7b800}
.editgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.canvas{position:relative;aspect-ratio:3/2;background:#fff;overflow:hidden;border-radius:15px;box-shadow:0 4px 18px #0002}.canvas img{width:100%;height:100%;object-fit:contain}.side label{display:block;font-weight:800;margin:9px 0 5px}.side textarea{width:100%;min-height:100px}.nav{text-align:center;margin:12px}.nav span{display:inline-block;min-width:90px;font-weight:850}@media(max-width:800px){.item{grid-template-columns:40px 80px 80px 1fr}.thumb{width:80px}.item .actions{grid-column:1/-1}.editgrid{grid-template-columns:1fr}}
</style></head><body>
<div class=wrap id=maker><h1>📖 마술연필 E북 만들기</h1><p class=hint>표지와 마지막 페이지는 직접 올리고, 아이 작품은 원본 → AI 완성 순서로 들어갑니다.</p>
<div class=card><div class=row><label class=file>📕 표지 올리기<input id=cover type=file accept="image/*" hidden></label><span id=coverTxt>표지 없음</span><label class=file>🏁 마지막 페이지 올리기<input id=end type=file accept="image/*" hidden></label><span id=endTxt>마지막 페이지 없음</span></div></div>
<div class=card><h3>＋ 아이 작품 추가</h3><div class=row><input id=name type=text placeholder="아이 이름"><label class=file>✏️ 원본 그림 선택<input id=orig type=file accept="image/*" hidden></label><span id=origTxt>선택 안 됨</span><label class=file>✨ AI 그림 선택<input id=ai type=file accept="image/*" hidden></label><span id=aiTxt>선택 안 됨</span><button class=primary id=add>＋ 작품 추가</button></div></div>
<div class=card><h3>📑 작품 순서 <small>— 추가하면 바로 아래에 나타납니다.</small></h3><div id=list class=pages></div></div>
<div class=card><h3>💬 선택한 작품 꾸미기</h3><div class=tools><button id=editOrig>✏️ 원본에 글자/말풍선 넣기</button><button id=editAi>✨ AI 그림에 글자/말풍선 넣기</button></div></div>
<div class=tools><button class=primary id=preview>📖 완성된 E북 보기</button><button class=danger id=reset>전체 초기화</button></div></div>

<div class="wrap book" id=book><div class=shell><div id=spread class=spread></div></div><div class=nav><button id=prev>〈 이전</button><span id=count></span><button id=next>다음 〉</button></div><div class=tools style="justify-content:center"><button id=back>✏️ 편집으로 돌아가기</button></div></div>

<div class="wrap decor" id=decor><h1>💬 페이지 꾸미기</h1><div class=editgrid><div id=canvas class=canvas></div><div class="card side"><button id=addText>✏️ 글자 추가</button> <button id=addBubble>💬 말풍선 추가</button><label>선택한 글 내용</label><textarea id=text></textarea><label>글자 크기</label><input id=size type=range min=16 max=54 value=28 style="width:100%"><div style="margin-top:10px"><button class=danger id=del>선택 요소 삭제</button></div><p style="font-size:13px">글자와 말풍선은 그림 위에서 끌어 이동할 수 있습니다.</p></div></div><div class=tools style="justify-content:center"><button class=primary id=done>✓ 편집 완료</button></div></div>

<script>
const KEY='magicEbookV4';let data=JSON.parse(localStorage.getItem(KEY)||'{"cover":"","end":"","works":[]}');let pending={orig:"",ai:""},selectedWork=0,decorRef=null,selectedEl=null,bookPages=[],bookIndex=0;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function fileData(file){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
async function simpleUpload(input,label,key){let f=input.files[0];if(!f)return;label.textContent=f.name;data[key]=await fileData(f);save()}
$('#cover').onchange=()=>simpleUpload($('#cover'),$('#coverTxt'),'cover');$('#end').onchange=()=>simpleUpload($('#end'),$('#endTxt'),'end');
$('#orig').onchange=async()=>{let f=$('#orig').files[0];if(!f)return;$('#origTxt').textContent=f.name;pending.orig=await fileData(f)};
$('#ai').onchange=async()=>{let f=$('#ai').files[0];if(!f)return;$('#aiTxt').textContent=f.name;pending.ai=await fileData(f)};
$('#add').onclick=()=>{let n=$('#name').value.trim();if(!pending.orig||!pending.ai){alert('원본 그림과 AI 그림을 모두 선택한 뒤 작품 추가를 눌러 주세요.');return}data.works.push({name:n||'이름 없음',original:pending.orig,ai:pending.ai,originalItems:[],aiItems:[]});selectedWork=data.works.length-1;save();pending={orig:"",ai:""};$('#name').value='';$('#orig').value='';$('#ai').value='';$('#origTxt').textContent='선택 안 됨';$('#aiTxt').textContent='선택 안 됨';renderList()};
function renderList(){let l=$('#list');if(!data.works.length){l.innerHTML='<div class=empty>아직 추가된 작품이 없습니다.</div>';return}l.innerHTML='';data.works.forEach((w,i)=>{let d=document.createElement('div');d.className='item '+(i===selectedWork?'sel':'');d.innerHTML=`<b>${i+1}</b><div><img class=thumb src="${w.original}"><div class=small>원본</div></div><div><img class=thumb src="${w.ai}"><div class=small>AI 완성</div></div><div><b>${w.name}</b><br><small>클릭해서 선택</small></div><div class=actions><button data-u="${i}">↑</button><button data-d="${i}">↓</button><button class=danger data-x="${i}">삭제</button></div>`;d.onclick=e=>{if(e.target.tagName!=='BUTTON'){selectedWork=i;renderList()}};l.appendChild(d)});l.querySelectorAll('[data-u]').forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.u,-1)});l.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();move(+b.dataset.d,1)});l.querySelectorAll('[data-x]').forEach(b=>b.onclick=e=>{e.stopPropagation();data.works.splice(+b.dataset.x,1);selectedWork=Math.max(0,Math.min(selectedWork,data.works.length-1));save();renderList()})}
function move(i,d){let j=i+d;if(j<0||j>=data.works.length)return;[data.works[i],data.works[j]]=[data.works[j],data.works[i]];selectedWork=j;save();renderList()}
function openDecor(kind){if(!data.works.length)return alert('먼저 작품을 추가해 주세요.');let w=data.works[selectedWork];decorRef={img:kind==='orig'?w.original:w.ai,items:kind==='orig'?w.originalItems:w.aiItems};$('#maker').style.display='none';$('#decor').style.display='block';renderDecor()}
$('#editOrig').onclick=()=>openDecor('orig');$('#editAi').onclick=()=>openDecor('ai');
function renderDecor(){let c=$('#canvas');c.innerHTML=`<img src="${decorRef.img}">`;selectedEl=null;decorRef.items.forEach((it,i)=>{let d=document.createElement('div');d.className='overlay '+it.type;d.textContent=it.text;d.style.left=it.x+'%';d.style.top=it.y+'%';d.style.fontSize=it.size+'px';d.dataset.i=i;makeDrag(d);d.onclick=e=>{e.stopPropagation();select(d)};c.appendChild(d)})}
function select(d){$('#canvas').querySelectorAll('.overlay').forEach(x=>x.classList.remove('selected'));selectedEl=d;d.classList.add('selected');let it=decorRef.items[+d.dataset.i];$('#text').value=it.text;$('#size').value=it.size}
function addOverlay(type){decorRef.items.push({type,text:type==='bubble'?'고마워!':'글자를 써 주세요.',x:15,y:15,size:type==='bubble'?24:28});save();renderDecor();select($('#canvas').querySelectorAll('.overlay')[decorRef.items.length-1])}
$('#addText').onclick=()=>addOverlay('text');$('#addBubble').onclick=()=>addOverlay('bubble');$('#text').oninput=e=>{if(!selectedEl)return;let it=decorRef.items[+selectedEl.dataset.i];it.text=e.target.value;selectedEl.textContent=it.text;save()};$('#size').oninput=e=>{if(!selectedEl)return;let it=decorRef.items[+selectedEl.dataset.i];it.size=+e.target.value;selectedEl.style.fontSize=it.size+'px';save()};$('#del').onclick=()=>{if(!selectedEl)return;decorRef.items.splice(+selectedEl.dataset.i,1);save();renderDecor()};
function makeDrag(el){let on=false,sx,sy,ox,oy;el.onpointerdown=e=>{on=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);select(el)};el.onpointermove=e=>{if(!on)return;let r=$('#canvas').getBoundingClientRect();el.style.left=Math.max(0,Math.min(88,ox+(e.clientX-sx)/r.width*100))+'%';el.style.top=Math.max(0,Math.min(88,oy+(e.clientY-sy)/r.height*100))+'%'};el.onpointerup=()=>{if(!on)return;on=false;let it=decorRef.items[+el.dataset.i];it.x=parseFloat(el.style.left);it.y=parseFloat(el.style.top);save()}}
$('#done').onclick=()=>{$('#decor').style.display='none';$('#maker').style.display='block';renderList()};
function buildBook(){bookPages=[];if(data.cover)bookPages.push({kind:'cover',img:data.cover,items:[]});data.works.forEach(w=>{bookPages.push({kind:'page',img:w.original,items:w.originalItems});bookPages.push({kind:'page',img:w.ai,items:w.aiItems})});if(data.end)bookPages.push({kind:'page',img:data.end,items:[]})}
function showBook(){buildBook();let p=bookPages[bookIndex],s=$('#spread');s.className='spread '+(p.kind==='cover'?'cover':'');s.innerHTML=`<img src="${p.img}">`+(p.items||[]).map(it=>`<div class="overlay ${it.type}" style="left:${it.x}%;top:${it.y}%;font-size:${it.size}px">${it.text.replace(/</g,'&lt;')}</div>`).join('');$('#count').textContent=`${bookIndex+1} / ${bookPages.length}`;$('#prev').disabled=bookIndex===0;$('#next').disabled=bookIndex===bookPages.length-1}
$('#preview').onclick=()=>{buildBook();if(!bookPages.length)return alert('표지나 작품을 먼저 추가해 주세요.');bookIndex=0;$('#maker').style.display='none';$('#book').style.display='block';showBook()};$('#prev').onclick=()=>{if(bookIndex){bookIndex--;showBook()}};$('#next').onclick=()=>{if(bookIndex<bookPages.length-1){bookIndex++;showBook()}};$('#back').onclick=()=>{$('#book').style.display='none';$('#maker').style.display='block'};
$('#reset').onclick=()=>{if(confirm('모든 E북 작업을 지울까요?')){localStorage.removeItem(KEY);location.reload()}};
renderList();
</script></body></html>
