<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마술연필 E북 만들기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f0df;color:#352d25;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:1280px;margin:auto;padding:18px}
h1{text-align:center;margin:6px}.sub{text-align:center;margin:6px 0 18px}.card{background:white;border-radius:20px;padding:16px;box-shadow:0 5px 20px #0001;margin-bottom:14px}
.row,.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,.file{border:0;border-radius:14px;background:white;box-shadow:0 2px 9px #0002;padding:11px 15px;font-size:16px;font-weight:800;cursor:pointer}.yellow{background:#ffe16a}.danger{color:#a11}
input[type=text]{padding:10px 12px;border:2px solid #ded1ad;border-radius:11px;font-size:16px}.list{display:grid;gap:10px}.work{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;border:2px solid #eee2c6;border-radius:16px;padding:10px}.pair{display:flex;gap:8px}.mini{width:110px;aspect-ratio:3/2;object-fit:cover;border-radius:9px;background:#eee}.label{font-size:13px;text-align:center}.bookArea{display:none}
.bookShell{max-width:1180px;margin:20px auto;perspective:1600px}.spread{position:relative;aspect-ratio:3/2;background:white;border-radius:10px 18px 18px 10px;overflow:hidden;box-shadow:0 18px 45px #5d4a2b44,0 3px 8px #0002}
.spread:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#00000018 42%,#fff8 50%,#00000018 58%,transparent);pointer-events:none}
.spread img{width:100%;height:100%;object-fit:contain;background:#fff}.coverSpread{background:transparent;box-shadow:none;display:flex;justify-content:center;overflow:visible}.coverSpread:after{display:none!important}.coverSpread img{height:100%;width:auto;max-width:50%;object-fit:contain;box-shadow:0 14px 35px #0003;border-radius:5px 15px 15px 5px}
.overlay{position:absolute;left:15%;top:15%;max-width:55%;padding:10px 14px;cursor:move;white-space:pre-wrap;z-index:3}.text{font-size:28px;font-weight:800;text-shadow:0 1px 2px white}.bubble{font-size:24px;font-weight:750;background:white;border:3px solid #3c342c;border-radius:28px}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.editCanvas{position:relative;aspect-ratio:3/2;background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0002}.editCanvas img{width:100%;height:100%;object-fit:contain}.side textarea{width:100%;min-height:90px;padding:9px;border:2px solid #ded1ad;border-radius:10px}.side label{display:block;font-weight:800;margin:9px 0 5px}.selected{outline:3px dashed #eab800}
.nav{text-align:center;margin:12px}.nav span{display:inline-block;min-width:90px;font-weight:850}@media(max-width:760px){.editor{grid-template-columns:1fr}.work{grid-template-columns:1fr}.coverSpread img{max-width:60%}}
</style></head><body><div class="wrap" id="maker">
<h1>📖 마술연필 E북 만들기</h1><p class="sub">표지와 마지막 장면은 직접 올리고, 아이 작품은 원본 → AI 완성 순서로 보여줍니다.</p>
<div class="card"><div class="row">
<label class="file">📕 표지 올리기<input id="coverFile" type=file accept="image/*" hidden></label><span id="coverName">표지 없음</span>
<label class="file">🏁 마지막 페이지 올리기<input id="endFile" type=file accept="image/*" hidden></label><span id="endName">마지막 페이지 없음</span>
</div></div>
<div class="card"><div class="row"><input id="kidName" type=text placeholder="아이 이름">
<label class="file">✏️ 아이 원본<input id="originalFile" type=file accept="image/*" hidden></label><span id="originalName">선택 안 됨</span>
<label class="file">✨ AI 완성<input id="aiFile" type=file accept="image/*" hidden></label><span id="aiName">선택 안 됨</span>
<button id="addWork" class="yellow">＋ 작품 추가</button></div></div>
<div class="card"><b>작품 순서</b><div class="list" id="list"></div></div>
<div class="card"><b>페이지 꾸미기</b><p style="margin:7px 0 10px">작품을 추가한 뒤 아래 버튼으로 원하는 페이지를 골라 말풍선과 글자를 넣을 수 있어요.</p>
<div class="tools"><button id="editOriginal">✏️ 선택 작품 원본 꾸미기</button><button id="editAI">✨ 선택 작품 AI 완성본 꾸미기</button></div></div>
<div class="tools"><button id="preview" class="yellow">📖 완성된 E북 보기</button><button id="clearAll" class="danger">전체 초기화</button></div>
</div>
<div class="wrap bookArea" id="book"><div class="bookShell"><div class="spread" id="spread"></div></div><div class="nav"><button id="prev">〈 이전</button><span id="count"></span><button id="next">다음 〉</button></div><div class="tools" style="justify-content:center"><button id="editBack">✏️ 편집으로 돌아가기</button><button id="decorate">💬 현재 작품 꾸미기</button></div></div>
<div class="wrap bookArea" id="decorator"><h1>페이지 꾸미기</h1><div class="editor"><div class="editCanvas" id="editCanvas"></div><div class="card side">
<button id="addText">✏️ 글자 추가</button> <button id="addBubble">💬 말풍선 추가</button>
<label>선택한 내용</label><textarea id="txt"></textarea><label>글자 크기</label><input id="size" type=range min=16 max=52 value=28 style="width:100%">
<button id="delObj" class="danger">선택 요소 삭제</button><p style="font-size:13px">글자와 말풍선은 끌어서 위치를 옮길 수 있습니다.</p></div></div><div class="tools" style="justify-content:center"><button id="doneDecor" class="yellow">완료</button></div></div>
<script>
let selectedWork=0;
let data=JSON.parse(localStorage.getItem('magicEbookV2')||'{"cover":"","end":"","works":[]}'), tmpO='',tmpA='',bookPages=[],idx=0,selected=null,decorPage=null;
const save=()=>localStorage.setItem('magicEbookV2',JSON.stringify(data)), read=(f,cb)=>{let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
function bindFile(id,fn,nameId){document.querySelector(id).onchange=e=>{let f=e.target.files[0];if(!f)return;document.querySelector(nameId).textContent=f.name;read(f,fn)}}
bindFile('#coverFile',v=>{data.cover=v;save()},'#coverName');bindFile('#endFile',v=>{data.end=v;save()},'#endName');bindFile('#originalFile',v=>tmpO=v,'#originalName');bindFile('#aiFile',v=>tmpA=v,'#aiName');
document.querySelector('#addWork').onclick=()=>{let n=document.querySelector('#kidName').value.trim();if(!tmpO||!tmpA)return alert('아이 원본과 AI 완성 그림을 모두 선택해 주세요.');data.works.push({name:n,original:tmpO,ai:tmpA,originalItems:[],aiItems:[]});tmpO=tmpA='';document.querySelector('#kidName').value='';document.querySelector('#originalName').textContent='선택 안 됨';document.querySelector('#aiName').textContent='선택 안 됨';save();renderList()};
function renderList(){let l=document.querySelector('#list');l.innerHTML='';data.works.forEach((w,i)=>{let d=document.createElement('div');d.className='work';d.innerHTML=`<b style="cursor:pointer" data-pick="${i}">${i+1}. ${w.name||'이름 없음'}</b><div class=pair><div><img class=mini src="${w.original}"><div class=label>원본</div></div><div><img class=mini src="${w.ai}"><div class=label>AI 완성</div></div></div><div><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button class=danger data-del="${i}">삭제</button></div>`;l.appendChild(d)});l.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selectedWork=+b.dataset.pick;renderList()});l.querySelectorAll('.work').forEach((x,i)=>{if(i===selectedWork)x.style.borderColor='#e7b900'});l.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));l.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));l.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data.works.splice(+b.dataset.del,1);save();renderList()})}
function move(i,d){let j=i+d;if(j<0||j>=data.works.length)return;[data.works[i],data.works[j]]=[data.works[j],data.works[i]];save();renderList()}
function build(){bookPages=[];if(data.cover)bookPages.push({kind:'cover',img:data.cover,items:[]});data.works.forEach((w,wi)=>{bookPages.push({kind:'original',img:w.original,items:w.originalItems,wi});bookPages.push({kind:'ai',img:w.ai,items:w.aiItems,wi})});if(data.end)bookPages.push({kind:'end',img:data.end,items:[]})}
function overlayHtml(it){return `<div class="overlay ${it.type}" style="left:${it.x}%;top:${it.y}%;font-size:${it.size}px">${it.text.replace(/</g,'&lt;')}</div>`}
function show(){build();if(!bookPages.length)return;idx=Math.min(idx,bookPages.length-1);let p=bookPages[idx],s=document.querySelector('#spread');s.className='spread '+(p.kind==='cover'?'coverSpread':'');s.innerHTML=`<img src="${p.img}">`+(p.items||[]).map(overlayHtml).join('');document.querySelector('#count').textContent=`${idx+1} / ${bookPages.length}`;document.querySelector('#prev').disabled=idx===0;document.querySelector('#next').disabled=idx===bookPages.length-1;document.querySelector('#decorate').style.display=(p.kind==='original'||p.kind==='ai')?'inline-block':'none'}
function openDecorForWork(kind){if(!data.works.length)return alert('먼저 작품을 추가해 주세요.');selectedWork=Math.min(selectedWork,data.works.length-1);let w=data.works[selectedWork];decorPage={kind:kind,img:kind==='original'?w.original:w.ai,items:kind==='original'?w.originalItems:w.aiItems,wi:selectedWork};document.querySelector('#maker').style.display='none';document.querySelector('#decorator').style.display='block';renderDecor()}
document.querySelector('#editOriginal').onclick=()=>openDecorForWork('original');
document.querySelector('#editAI').onclick=()=>openDecorForWork('ai');
document.querySelector('#preview').onclick=()=>{if(!data.cover)return alert('표지를 먼저 올려 주세요.');idx=0;document.querySelector('#maker').style.display='none';document.querySelector('#book').style.display='block';show()};document.querySelector('#prev').onclick=()=>{if(idx){idx--;show()}};document.querySelector('#next').onclick=()=>{if(idx<bookPages.length-1){idx++;show()}};document.querySelector('#editBack').onclick=()=>{document.querySelector('#book').style.display='none';document.querySelector('#maker').style.display='block'};
document.querySelector('#clearAll').onclick=()=>{if(confirm('E북 작업을 모두 지울까요?')){localStorage.removeItem('magicEbookV2');location.reload()}};
function renderDecor(){let c=document.querySelector('#editCanvas');c.innerHTML=`<img src="${decorPage.img}">`;selected=null;(decorPage.items||[]).forEach((it,i)=>{let d=document.createElement('div');d.className='overlay '+it.type;d.style.left=it.x+'%';d.style.top=it.y+'%';d.style.fontSize=it.size+'px';d.textContent=it.text;d.dataset.i=i;drag(d);d.onclick=e=>{e.stopPropagation();select(d)};c.appendChild(d)})}
function select(d){document.querySelectorAll('#editCanvas .overlay').forEach(x=>x.classList.remove('selected'));selected=d;d.classList.add('selected');let it=decorPage.items[+d.dataset.i];document.querySelector('#txt').value=it.text;document.querySelector('#size').value=it.size}
function add(type){decorPage.items.push({type,text:type==='bubble'?'고마워!':'글자를 써 주세요.',x:15,y:15,size:type==='bubble'?24:28});renderDecor()}
function drag(el){let go=false,sx,sy,ox,oy;el.onpointerdown=e=>{go=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);select(el)};el.onpointermove=e=>{if(!go)return;let r=document.querySelector('#editCanvas').getBoundingClientRect();el.style.left=Math.max(0,Math.min(88,ox+(e.clientX-sx)/r.width*100))+'%';el.style.top=Math.max(0,Math.min(88,oy+(e.clientY-sy)/r.height*100))+'%'};el.onpointerup=()=>{if(!go)return;go=false;let it=decorPage.items[+el.dataset.i];it.x=parseFloat(el.style.left);it.y=parseFloat(el.style.top);save()}}
document.querySelector('#decorate').onclick=()=>{decorPage=bookPages[idx];document.querySelector('#book').style.display='none';document.querySelector('#decorator').style.display='block';renderDecor()};document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#addBubble').onclick=()=>add('bubble');
document.querySelector('#txt').oninput=e=>{if(!selected)return;let it=decorPage.items[+selected.dataset.i];it.text=e.target.value;selected.textContent=it.text;save()};document.querySelector('#size').oninput=e=>{if(!selected)return;let it=decorPage.items[+selected.dataset.i];it.size=+e.target.value;selected.style.fontSize=it.size+'px';save()};
document.querySelector('#delObj').onclick=()=>{if(!selected)return;decorPage.items.splice(+selected.dataset.i,1);renderDecor();save()};document.querySelector('#doneDecor').onclick=()=>{save();document.querySelector('#decorator').style.display='none';document.querySelector('#maker').style.display='block';renderList()};
renderList();
</script></body></html>
