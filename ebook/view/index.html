<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 마술연필 E북</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee7d7;font-family:Arial,"Noto Sans KR",sans-serif;color:#332e27}
.wrap{max-width:1100px;margin:auto;padding:12px}
.top{text-align:center;margin-bottom:10px;font-weight:900}
.book{perspective:1800px;background:#bba67c;padding:14px;border-radius:20px;box-shadow:0 15px 40px #0003}
.page{position:relative;aspect-ratio:3/2;background:white;border-radius:8px;overflow:hidden;transform-origin:left center;transition:transform .48s ease,opacity .48s ease;box-shadow:inset 0 0 30px #0000000d}
.page.turn-next{transform:rotateY(-16deg) translateX(-2%);opacity:.45}
.page.turn-prev{transform:rotateY(16deg) translateX(2%);opacity:.45}
canvas{width:100%;height:100%;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;background:white;z-index:2}
.nav{text-align:center;padding:14px}
.nav button{border:0;background:white;padding:11px 20px;border-radius:13px;font-weight:900;margin:0 6px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.count{display:inline-block;min-width:90px;font-weight:800}
.notice{text-align:center;font-size:12px;color:#6b655b;padding:0 10px 10px}
@media(max-width:700px){
  .wrap{padding:6px}
  .book{padding:7px;border-radius:12px}
  .nav{padding:10px 0}
  .nav button{padding:10px 15px;margin:0 3px}
  .count{min-width:72px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">📖 우리들의 마술연필 E북</div>
  <div class="book">
    <div id="page" class="page">
      <div id="loading" class="loading">E북을 불러오는 중...</div>
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <div class="nav">
    <button id="prev">‹ 이전</button>
    <span id="count" class="count"></span>
    <button id="next">다음 ›</button>
  </div>
  <div class="notice">PC는 이전/다음 버튼, 모바일은 좌우로 밀어 페이지를 넘길 수 있어요.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// index.html과 book.pdf가 모두 ebook/view/ 안에 있으므로 같은 폴더를 가리킵니다.
const pdfUrl = './book.pdf';

let pdfDoc = null;
let pageNum = 1;
let rendering = false;
let pendingPage = null;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pageEl = document.getElementById('page');
const loading = document.getElementById('loading');
const count = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');

async function renderPage(num){
  rendering = true;
  try{
    const page = await pdfDoc.getPage(num);
    const baseViewport = page.getViewport({scale:1});
    const targetWidth = Math.min(1800, Math.max(900, pageEl.clientWidth * (window.devicePixelRatio || 1)));
    const scale = targetWidth / baseViewport.width;
    const viewport = page.getViewport({scale});

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({canvasContext:ctx, viewport}).promise;
    pageNum = num;
    count.textContent = `${pageNum} / ${pdfDoc.numPages}`;
    prev.disabled = pageNum <= 1;
    next.disabled = pageNum >= pdfDoc.numPages;
    loading.style.display = 'none';
  }catch(err){
    console.error(err);
    loading.textContent = '페이지를 불러오지 못했어요.';
    loading.style.display = 'flex';
  }finally{
    rendering = false;
    if(pendingPage !== null){
      const n = pendingPage;
      pendingPage = null;
      renderPage(n);
    }
  }
}

function queueRender(num){
  if(!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
  if(rendering) pendingPage = num;
  else renderPage(num);
}

function turnTo(num, direction){
  if(!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
  pageEl.classList.add(direction === 'next' ? 'turn-next' : 'turn-prev');
  setTimeout(() => {
    queueRender(num);
    pageEl.classList.remove('turn-next','turn-prev');
  }, 180);
}

prev.addEventListener('click', () => turnTo(pageNum - 1, 'prev'));
next.addEventListener('click', () => turnTo(pageNum + 1, 'next'));

let startX = 0, startY = 0;
pageEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  startX = t.clientX; startY = t.clientY;
}, {passive:true});
pageEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0) turnTo(pageNum + 1, 'next');
    else turnTo(pageNum - 1, 'prev');
  }
}, {passive:true});

pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
  pdfDoc = pdf;
  renderPage(1);
}).catch(err => {
  console.error(err);
  loading.innerHTML = 'PDF를 불러오지 못했어요.<br><small>ebook/view/book.pdf 파일을 확인해 주세요.</small>';
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(pdfDoc) queueRender(pageNum); }, 200);
});
</script>
</body>
</html>
