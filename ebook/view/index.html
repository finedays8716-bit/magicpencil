<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>새싹반의 마술연필</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee7d7;font-family:Arial,"Noto Sans KR",sans-serif;color:#332e27}.wrap{max-width:1100px;margin:auto;padding:10px}.title{text-align:center;font-weight:900;padding:5px 0 10px}.book{perspective:1800px;background:#bba67c;padding:12px;border-radius:20px;box-shadow:0 15px 40px #0003}.page{aspect-ratio:3/2;background:#fff;border-radius:8px;overflow:hidden;transform-origin:left center;transition:transform .4s ease,opacity .4s ease}.page.next{transform:rotateY(-17deg);opacity:.4}.page.prev{transform:rotateY(17deg);opacity:.4}.page img{display:block;width:100%;height:100%;object-fit:contain}.nav{text-align:center;padding:13px}.nav button{border:0;background:#fff;padding:11px 18px;border-radius:13px;font-weight:900;margin:0 5px}.nav button:disabled{opacity:.4}.count{display:inline-block;min-width:85px;font-weight:900}.notice{text-align:center;font-size:12px;color:#6b655b}@media(max-width:700px){.wrap{padding:5px}.book{padding:6px;border-radius:11px}.nav button{padding:10px 13px;margin:0 2px}.count{min-width:68px}}</style></head><body><div class="wrap"><div class="title">📖 새싹반의 마술연필</div><div class="book"><div id="page" class="page"><img id="img" src="/ebook/view/pages/page-01.jpg" alt="E북 페이지"></div></div><div class="nav"><button id="prev">〈 이전</button><span id="count" class="count"></span><button id="next">다음 〉</button></div><div class="notice">화면을 좌우로 밀어 페이지를 넘겨보세요.</div></div><script>
const total=34;let n=1,busy=false;const box=document.getElementById('page'),img=document.getElementById('img'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
function src(n){return '/ebook/view/pages/page-'+String(n).padStart(2,'0')+'.jpg'}function update(){img.src=src(n);count.textContent=n+' / '+total;prev.disabled=n<=1;next.disabled=n>=total}function go(d){if(busy)return;const nn=n+d;if(nn<1||nn>total)return;busy=true;box.classList.add(d>0?'next':'prev');setTimeout(()=>{n=nn;update();box.classList.remove('next','prev');busy=false},180)}prev.onclick=()=>go(-1);next.onclick=()=>go(1);let sx=0,sy=0;box.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});box.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1)},{passive:true});update();
</script></body></html>
