<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리들의 마술연필 E북</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee7d7;font-family:Arial,"Noto Sans KR",sans-serif;color:#332e27;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.home{padding:9px 14px;background:white;border-radius:12px;color:#333;text-decoration:none;font-weight:800}.book{perspective:1800px;background:#bba67c;padding:14px;border-radius:20px;box-shadow:0 15px 40px #0003}.page{position:relative;aspect-ratio:3/2;background:white;border-radius:8px;overflow:hidden;transform-origin:left center;transition:transform .48s ease,opacity .48s ease;box-shadow:inset 0 0 30px #0000000c}.page.turn-next{transform:rotateY(-16deg) translateX(-2%);opacity:.45}.page.turn-prev{transform:rotateY(16deg) translateX(2%);opacity:.45}canvas{width:100%;height:100%;display:block}.nav{text-align:center;padding:14px}.nav button{border:0;background:white;padding:11px 20px;border-radius:13px;font-weight:900;margin:0 6px;cursor:pointer}.count{display:inline-block;min-width:90px;font-weight:800}.notice{text-align:center;font-size:12px;color:#6b655b}.loading{text-align:center;padding:30px;font-weight:800}@media(max-width:700px){.wrap{padding:6px}.book{padding:6px}.nav button{padding:10px 14px}}
</style></head><body><div class="wrap"><div class="top"><a class="home" href="../../">🏠 처음으로</a><b>📖 우리들의 마술연필</b></div><div class="book"><div id="page" class="page"><div class="loading">E북을 불러오는 중...</div><canvas id="canvas"></canvas></div></div><div class="nav"><button id="prev">〈 이전</button><span id="count" class="count"></span><button id="next">다음 〉</button></div><div class="notice">화면을 좌우로 밀어 페이지를 넘길 수 있습니다.</div></div>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
let pdf=null,n=1,busy=false;const box=document.getElementById('page'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),count=document.getElementById('count');
async function render(){if(!pdf)return;const p=await pdf.getPage(n);const base=p.getViewport({scale:1});const scale=Math.min(2,1536/base.width);const vp=p.getViewport({scale});canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:ctx,viewport:vp}).promise;count.textContent=n+' / '+pdf.numPages;document.getElementById('prev').disabled=n<=1;document.getElementById('next').disabled=n>=pdf.numPages}
async function go(d){if(busy||!pdf)return;const nn=n+d;if(nn<1||nn>pdf.numPages)return;busy=true;box.classList.add(d>0?'turn-next':'turn-prev');setTimeout(async()=>{n=nn;await render();box.classList.remove('turn-next','turn-prev');busy=false},250)}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
let sx=0;box.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1)},{passive:true});
try{pdf=await pdfjsLib.getDocument({url:'book.pdf'}).promise;document.querySelector('.loading')?.remove();await render()}catch(e){document.querySelector('.loading').textContent='book.pdf를 불러오지 못했습니다. GitHub의 ebook/view/book.pdf 위치를 확인해 주세요.';console.error(e)}
</script></body></html>
