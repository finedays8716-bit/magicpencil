<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리들의 마술연필</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee7d7;font-family:Arial,"Noto Sans KR",sans-serif;color:#332e27}
.wrap{max-width:1120px;margin:auto;padding:10px}
.title{text-align:center;font-weight:900;padding:5px 0 10px}
.book{position:relative;perspective:2400px;background:#bba67c;padding:12px;border-radius:20px;box-shadow:0 15px 40px #0003;overflow:hidden}
.stage{position:relative;aspect-ratio:3/2;background:#fff;border-radius:8px;overflow:hidden}
.sheet{position:absolute;inset:0;background:#fff;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform;box-shadow:0 0 0 rgba(0,0,0,0)}
.sheet img{width:100%;height:100%;display:block;object-fit:contain}
.sheet.current{z-index:3}
.sheet.under{z-index:1}
.sheet.turn-next{transform-origin:left center;animation:turnNext .72s cubic-bezier(.55,.06,.35,1) forwards}
.sheet.turn-prev{transform-origin:right center;animation:turnPrev .72s cubic-bezier(.55,.06,.35,1) forwards}
.sheet.turn-next:after,.sheet.turn-prev:after{content:"";position:absolute;inset:0;pointer-events:none}
.sheet.turn-next:after{background:linear-gradient(90deg,transparent 45%,rgba(0,0,0,.08) 68%,rgba(0,0,0,.28) 100%)}
.sheet.turn-prev:after{background:linear-gradient(270deg,transparent 45%,rgba(0,0,0,.08) 68%,rgba(0,0,0,.28) 100%)}
@keyframes turnNext{
  0%{transform:rotateY(0deg);box-shadow:0 0 0 rgba(0,0,0,0)}
  45%{box-shadow:18px 6px 28px rgba(0,0,0,.22)}
  100%{transform:rotateY(-180deg);box-shadow:28px 8px 35px rgba(0,0,0,.08)}
}
@keyframes turnPrev{
  0%{transform:rotateY(0deg);box-shadow:0 0 0 rgba(0,0,0,0)}
  45%{box-shadow:-18px 6px 28px rgba(0,0,0,.22)}
  100%{transform:rotateY(180deg);box-shadow:-28px 8px 35px rgba(0,0,0,.08)}
}
.nav{text-align:center;padding:13px}
.nav button{border:0;background:#fff;padding:11px 18px;border-radius:13px;font-weight:900;margin:0 5px;cursor:pointer;box-shadow:0 2px 7px #0001}
.nav button:disabled{opacity:.4;cursor:default}
.count{display:inline-block;min-width:85px;font-weight:900}
.notice{text-align:center;font-size:12px;color:#6b655b}
.error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9;background:#fff;color:#8b2d20;font-weight:800}
@media(max-width:700px){
 .wrap{padding:5px}.book{padding:6px;border-radius:11px}.nav button{padding:10px 13px;margin:0 2px}.count{min-width:68px}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="title">📖 우리들의 마술연필</div>
 <div class="book">
   <div id="stage" class="stage">
     <div id="under" class="sheet under"><img id="underImg" alt=""></div>
     <div id="current" class="sheet current"><img id="currentImg" alt="E북 페이지"></div>
     <div id="error" class="error"></div>
   </div>
 </div>
 <div class="nav">
   <button id="prev">〈 이전</button><span id="count" class="count"></span><button id="next">다음 〉</button>
 </div>
 <div class="notice">PC는 이전/다음 버튼 · 모바일은 화면을 좌우로 밀어 책장을 넘겨보세요.</div>
</div>
<script>
const total=14;
let n=1,busy=false;
const current=document.getElementById('current'),under=document.getElementById('under');
const currentImg=document.getElementById('currentImg'),underImg=document.getElementById('underImg');
const count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
const error=document.getElementById('error');

function pageSrc(i){
  // 절대경로 사용: Vercel의 현재 URL/라우팅과 무관하게 정확히 ebook/view/pages를 가리킴
  return '/ebook/view/pages/page-'+String(i).padStart(2,'0')+'.jpg';
}
function setButtons(){
  count.textContent=n+' / '+total;
  prev.disabled=n<=1||busy;
  next.disabled=n>=total||busy;
}
function showError(i){
  error.style.display='flex';
  error.innerHTML='페이지 '+i+' 그림을 불러오지 못했어요.<br><small>'+pageSrc(i)+'</small>';
}
function hideError(){error.style.display='none'}
function loadInto(img,i){
  return new Promise((resolve,reject)=>{
    img.onload=()=>resolve();
    img.onerror=()=>reject(new Error(pageSrc(i)));
    img.src=pageSrc(i)+'?v=2';
  });
}
async function init(){
  try{await loadInto(currentImg,n);hideError()}catch(e){showError(n)}
  setButtons();
}
async function go(d){
  if(busy)return;
  const nn=n+d;
  if(nn<1||nn>total)return;
  busy=true;setButtons();hideError();
  try{
    await loadInto(underImg,nn);
  }catch(e){
    busy=false;setButtons();showError(nn);return;
  }
  current.classList.remove('turn-next','turn-prev');
  void current.offsetWidth;
  current.classList.add(d>0?'turn-next':'turn-prev');
  setTimeout(()=>{
    n=nn;
    currentImg.src=underImg.src;
    current.classList.remove('turn-next','turn-prev');
    busy=false;setButtons();
  },720);
}
prev.onclick=()=>go(-1);
next.onclick=()=>go(1);
let sx=0,sy=0;
document.getElementById('stage').addEventListener('touchstart',e=>{
  sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;
},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
},{passive:true});
init();
</script>
</body>
</html>
